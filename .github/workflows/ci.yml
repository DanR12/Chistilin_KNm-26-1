name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore OrderFlow.slnx

    - name: Build
      run: dotnet build OrderFlow.slnx --no-restore

    - name: Run Smoke Tests
      run: dotnet test OrderFlow.slnx --no-build --verbosity normal
